name: sonar

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    uses: RimWorks/mod-ci/.github/workflows/sonar.yml@v1.11
    with:
      solution: Concord.RimWorld.slnx
      project-key: ConcordLib_RimWorld
      organization: concordlib
      analyzer-severity: none
      coverage-exclusions: '**'
      extra-begin-args: /d:sonar.scanner.scanAll=false /d:sonar.qualitygate.wait=true
      pre-scan-command: |
        set -euo pipefail
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker create --name rwgame ghcr.io/concordlib/rimworld-game:1.7-unstable
        mkdir -p /opt/rimworld
        docker cp rwgame:/game/. /opt/rimworld/
        docker rm -f rwgame
        echo "GameManagedDir=$(dirname "$(find /opt/rimworld -name Assembly-CSharp.dll | head -1)")" >> "$GITHUB_ENV"
      test-command: dotnet test Source/ConcordRimWorld.Tests -c Release --nologo
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
