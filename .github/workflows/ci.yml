name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [core-released]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (RW ${{ matrix.rw }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rw: '1.6', branch: 'public' }
          - { rw: '1.5', branch: 'version-1.5' }
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # blame data for the SonarCloud scan below

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/share/miniconda /usr/local/share/powershell
          sudo docker image prune -af
          df -h /

      - name: Stage RimWorld reference image
        id: game
        uses: cryptiklemur/steam-game-image-action@19937bfbdc67d5f6f12135e4b27d61bf790d8133 # v1
        with:
          app-id: '294100'
          branch: ${{ matrix.branch }}
          steam-username: ${{ vars.STEAM_USERNAME }}
          steam-config-vdf: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          image: ghcr.io/concordlib/rimworld-game
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          runnable: 'false'

      - name: Extract game DLLs from the image
        run: |
          set -euo pipefail
          # The action always sets image-ref: the version tag when it built, the
          # branch-scoped latest-<branch> tag when the build-id gate skipped.
          IMG="${{ steps.game.outputs.image-ref }}"
          test -n "$IMG" || { echo "steam-game-image-action returned no image-ref" >&2; exit 1; }
          docker create --name rwgame "$IMG"
          mkdir -p /opt/rimworld
          docker cp rwgame:/game/. /opt/rimworld/
          docker rm -f rwgame
          test -n "$(find /opt/rimworld -name Assembly-CSharp.dll | head -1)" || { echo "Assembly-CSharp.dll not found under /opt/rimworld after extract" >&2; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply dispatched Core version
        if: github.event_name == 'repository_dispatch'
        env:
          CORE_VERSION: ${{ github.event.client_payload.core_version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="${CORE_VERSION#v}"
          test -n "$PACKAGE_VERSION" || { echo "core-released did not provide a version" >&2; exit 1; }
          dotnet add Source/ConcordRimWorld.Tests/ConcordRimWorld.Tests.csproj package Concord.Runtime --version "$PACKAGE_VERSION" --no-restore
          dotnet add Source/ConcordRimWorld.Tests/ConcordRimWorld.Tests.csproj package Concord.Harmony --version "$PACKAGE_VERSION" --no-restore
          dotnet add Source/ConcordRimWorld/ConcordRimWorld.csproj package Concord.Ref --version "$PACKAGE_VERSION" --no-restore
          dotnet add Source/ConcordRimWorld/ConcordRimWorld.csproj package Concord.Harmony --version "$PACKAGE_VERSION" --no-restore
          dotnet add Source/ConcordRimWorld.TestMod/ConcordRimWorld.TestMod.csproj package Concord.Ref --version "$PACKAGE_VERSION" --no-restore

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      # SonarCloud wraps the build below, but only on the 1.6 cell: both matrix cells compile the
      # same sources, so scanning each would submit two reports for one commit and the second
      # would overwrite the first. The 1.5 cell builds normally because `begin` never ran there.
      #
      # Coverage is excluded because it cannot be measured here. The tests target net472 and run
      # under mono (the Linux SDK ships no testhost.net472.exe, so `dotnet test` cannot host
      # them), and coverlet's hit-flush does not fire under mono, so instrumentation records 0%
      # while all 53 tests pass. Reporting that 0% would fail the Sonar way gate's 80% new-code
      # coverage condition on a number that measures nothing, and the gate cannot be changed on
      # this SonarCloud plan. Drop this line if the suite ever runs somewhere coverlet works.
      - name: Setup Java for the scanner
        if: matrix.rw == '1.6'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install scanner
        if: matrix.rw == '1.6'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonar begin
        if: matrix.rw == '1.6'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          dotnet sonarscanner begin \
            /k:"ConcordLib_RimWorld" \
            /o:"concordlib" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.coverage.exclusions=** \
            /d:sonar.qualitygate.wait=true

      - name: Build
        run: |
          set -euo pipefail
          DLLDIR=$(dirname "$(find /opt/rimworld -name Assembly-CSharp.dll | head -1)")
          dotnet build Concord.RimWorld.slnx -c Release -p:RimWorldManaged="$DLLDIR"

      - name: Test (net472 under mono)
        run: |
          set -euo pipefail
          RUNNER=$(find ~/.nuget/packages/xunit.runner.console -name xunit.console.exe -path '*net472*' | sort -V | tail -1)
          TESTDLL=$(find Source/ConcordRimWorld.Tests/bin/Release -name ConcordRimWorld.Tests.dll | head -1)
          mono "$RUNNER" "$TESTDLL"

      # Placed after the tests so a red gate fails the job only once the suite has had its say.
      - name: Sonar end
        if: matrix.rw == '1.6'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  release:
    name: Release
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The repository_dispatch path commits and pushes the Core package-version bump.
          persist-credentials: true

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/share/miniconda /usr/local/share/powershell
          sudo docker image prune -af
          df -h /

      - name: Synthetic bump for Core release
        if: github.event_name == 'repository_dispatch'
        env:
          CORE_VERSION: ${{ github.event.client_payload.core_version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="${CORE_VERSION#v}"
          test -n "$PACKAGE_VERSION" || { echo "core-released did not provide a version" >&2; exit 1; }
          dotnet add Source/ConcordRimWorld.Tests/ConcordRimWorld.Tests.csproj package Concord.Runtime --version "$PACKAGE_VERSION" --no-restore
          dotnet add Source/ConcordRimWorld.Tests/ConcordRimWorld.Tests.csproj package Concord.Harmony --version "$PACKAGE_VERSION" --no-restore
          dotnet add Source/ConcordRimWorld/ConcordRimWorld.csproj package Concord.Ref --version "$PACKAGE_VERSION" --no-restore
          dotnet add Source/ConcordRimWorld/ConcordRimWorld.csproj package Concord.Harmony --version "$PACKAGE_VERSION" --no-restore
          dotnet add Source/ConcordRimWorld.TestMod/ConcordRimWorld.TestMod.csproj package Concord.Ref --version "$PACKAGE_VERSION" --no-restore
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Source/ConcordRimWorld.Tests/ConcordRimWorld.Tests.csproj Source/ConcordRimWorld/ConcordRimWorld.csproj Source/ConcordRimWorld.TestMod/ConcordRimWorld.TestMod.csproj
          git commit --allow-empty -m "fix(core): rebuild against Concord ${CORE_VERSION:-latest}"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Stage RimWorld reference image
        id: game
        uses: cryptiklemur/steam-game-image-action@19937bfbdc67d5f6f12135e4b27d61bf790d8133 # v1
        with:
          app-id: '294100'
          branch: public
          steam-username: ${{ vars.STEAM_USERNAME }}
          steam-config-vdf: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          image: ghcr.io/concordlib/rimworld-game
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          runnable: 'false'

      - name: Extract game DLLs from the image
        run: |
          set -euo pipefail
          # The action always sets image-ref: the version tag when it built, the
          # branch-scoped latest-<branch> tag when the build-id gate skipped.
          IMG="${{ steps.game.outputs.image-ref }}"
          test -n "$IMG" || { echo "steam-game-image-action returned no image-ref" >&2; exit 1; }
          docker create --name rwgame "$IMG"
          mkdir -p /opt/rimworld
          docker cp rwgame:/game/. /opt/rimworld/
          docker rm -f rwgame
          test -n "$(find /opt/rimworld -name Assembly-CSharp.dll | head -1)" || { echo "Assembly-CSharp.dll not found under /opt/rimworld after extract" >&2; exit 1; }

      - name: Build the mod
        run: |
          set -euo pipefail
          DLLDIR=$(dirname "$(find /opt/rimworld -name Assembly-CSharp.dll | head -1)")
          dotnet build Concord.RimWorld.slnx -c Release -p:RimWorldManaged="$DLLDIR"

      # Fetch the runtime straight from nuget.org rather than reading ~/.nuget/packages. The cache
      # is restored with restore-keys, so its newest Concord.Runtime is whatever an earlier run
      # happened to leave there. That shipped a 0.9.0 runtime for four releases while the adapter
      # moved on, and any mod compiled against a later Core failed to load against it.
      # Core dispatches a release roughly thirty seconds after publishing, and nuget.org takes
      # minutes to serve a new version, so the wanted version is routinely missing on the first
      # look. Retry rather than fail the release.
      - name: Stage the shipped runtime dll
        env:
          CORE_VERSION: ${{ github.event.client_payload.core_version }}
        run: |
          set -euo pipefail
          WANT="${CORE_VERSION#v}"
          INDEX=https://api.nuget.org/v3-flatcontainer/concord.runtime/index.json
          VERSION=""
          for attempt in $(seq 1 20); do
            BODY=$(curl -sS "$INDEX" 2>/dev/null || true)
            if [ -n "$BODY" ]; then
              if [ -n "$WANT" ]; then
                if printf '%s' "$BODY" | jq -e --arg v "$WANT" '.versions | index($v) != null' >/dev/null 2>&1; then
                  VERSION="$WANT"
                  break
                fi
              else
                VERSION=$(printf '%s' "$BODY" | jq -r '[.versions[] | select(contains("-") | not)] | last')
                if [ -n "$VERSION" ] && [ "$VERSION" != "null" ]; then
                  break
                fi
                VERSION=""
              fi
            fi
            echo "Concord.Runtime ${WANT:-latest} is not on nuget.org yet; retrying in 15s ($attempt/20)"
            sleep 15
          done
          test -n "$VERSION" || { echo "Concord.Runtime ${WANT:-latest} never appeared on nuget.org." >&2; exit 1; }

          echo "Staging Concord.Runtime $VERSION"
          for attempt in $(seq 1 5); do
            curl -sSf "https://api.nuget.org/v3-flatcontainer/concord.runtime/$VERSION/concord.runtime.$VERSION.nupkg" \
              -o /tmp/concord.runtime.nupkg && break
            echo "Download failed; retrying in 10s ($attempt/5)"
            sleep 10
          done
          test -s /tmp/concord.runtime.nupkg || { echo "Could not download Concord.Runtime $VERSION." >&2; exit 1; }

          unzip -p /tmp/concord.runtime.nupkg 'lib/net472/Concord.dll' > Current/Assemblies/0Concord.dll
          test -s Current/Assemblies/0Concord.dll || { echo "Concord.Runtime $VERSION ships no lib/net472/Concord.dll." >&2; exit 1; }

      - name: Install semantic-release
        run: npm install --no-save semantic-release@24 conventional-changelog-conventionalcommits@9 semantic-release-steam@2

      - name: Set up SteamCMD
        uses: buildalon/setup-steamcmd@2a16e8f482192d9a5710a17f0119890ceb1f48a1 # v1

      - name: Restore Steam config
        env:
          STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
        run: |
          mkdir -p "$STEAM_DIR/config"
          printf '%s' "$STEAM_CONFIG_VDF_B64" | base64 -d > "$STEAM_DIR/config/config.vdf"
          echo "STEAM_CONFIG_VDF=$STEAM_DIR/config/config.vdf" >> "$GITHUB_ENV"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEAM_USERNAME: ${{ vars.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ env.STEAM_CONFIG_VDF }}
          STEAMCMD_PATH: ${{ env.STEAM_CMD }}/steamcmd.sh
        run: npx -y -p semantic-release@24 -p conventional-changelog-conventionalcommits@9 -p semantic-release-steam@2 semantic-release
