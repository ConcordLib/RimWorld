name: ci

on:
  workflow_call:
    inputs:
      concord-version:
        description: pin every leg to this Concord package version instead of the floating default
        type: string
        default: ''
    outputs:
      image-refs:
        description: JSON map of game version to the image that version compiled against
        value: ${{ jobs.images.outputs.image-refs }}
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  images:
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v5
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: ci-image-ref
      image: ghcr.io/concordlib/rimworld-game
      branches: |
        ${{ github.event_name != 'pull_request' && '1.1=version-1.1' || '' }}
        ${{ github.event_name != 'pull_request' && '1.2=version-1.2' || '' }}
        ${{ github.event_name != 'pull_request' && '1.3=version-1.3-latest' || '' }}
        ${{ github.event_name != 'pull_request' && '1.4=version-1.4.3901' || '' }}
        ${{ github.event_name != 'pull_request' && '1.5=version-1.5' || '' }}
        1.6=public
        1.7=unstable
    secrets:
      STEAM_USERNAME: ${{ vars.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
      DEPOTDOWNLOADER_ACCOUNT_B64: ${{ secrets.DEPOTDOWNLOADER_ACCOUNT_B64 }}

  build:
    name: build
    needs: images
    uses: RimWorks/mod-ci/.github/workflows/dotnet-build.yml@v5
    permissions:
      contents: read
      checks: write
      packages: read
    with:
      solution: Concord.RimWorld.slnx
      test: false
      format: true
      artifact-name: build-output
      artifact-paths: |
        [0-9].[0-9]/
      game-images: ${{ needs.images.outputs.image-refs }}

  test:
    name: test ${{ matrix.version }}
    needs: images
    runs-on: ubuntu-latest
    env:
      ConcordVersion: ${{ inputs.concord-version }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'pull_request' && '["1.6","1.7"]' || '["1.1","1.2","1.3","1.4","1.5","1.6","1.7"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Stage game assemblies
        id: refs
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v5
        with:
          image: ${{ fromJSON(needs.images.outputs.image-refs)[matrix.version] }}

      - name: Point msbuild at this leg's version and refs
        run: |
          echo "GameVersion=${{ matrix.version }}" >> "$GITHUB_ENV"
          echo "GameManagedDir=${{ steps.refs.outputs.managed-dir }}" >> "$GITHUB_ENV"

      - name: Install mono
        if: matrix.version != '1.7'
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Test under mono
        if: matrix.version != '1.7'
        run: CONFIG=Release ./Source/run-net472.sh

      - name: Test
        if: matrix.version == '1.7'
        run: >
          dotnet test Source/ConcordRimWorld.Tests -c Release --nologo
          --logger "trx;LogFileName=tests.trx" --results-directory "$RUNNER_TEMP/test-results"

      - name: Publish the test results
        if: always() && matrix.version == '1.7'
        uses: dorny/test-reporter@v3
        with:
          name: unit tests ${{ matrix.version }}
          path: ${{ runner.temp }}/test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: false

  gate:
    name: ci gate
    if: always()
    needs: [images, build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: RimWorks/mod-ci/.github/actions/gate@v5
        with:
          results: ${{ join(needs.*.result, ' ') }}
