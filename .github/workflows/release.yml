name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      announce-tag:
        description: announce this already published tag in discord and run nothing else
        default: ''
  repository_dispatch:
    types: [core-released]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  announce:
    if: github.event.inputs.announce-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: RimWorks/mod-ci/.github/actions/discord-release@v4
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          mod-name: Concord
          role-ids: ${{ vars.DISCORD_ROLE_IDS }}
          workshop-id: '3758333473'
          embed-color: 9B59B6
          release-tag: ${{ github.event.inputs.announce-tag }}

  wait-for-core:
    if: github.event.inputs.announce-tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      concord-version: ${{ steps.wait.outputs.concord-version }}
    steps:
      - name: Wait for the Core packages on nuget.org
        id: wait
        env:
          CORE_VERSION: ${{ github.event.client_payload.core_version }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != 'repository_dispatch' ]]; then
            echo "concord-version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PACKAGE_VERSION="${CORE_VERSION#v}"
          test -n "$PACKAGE_VERSION" || { echo "::error::core-released did not provide a version"; exit 1; }

          for package in concord.ref concord.runtime concord.harmony concord.host.adapter; do
            for attempt in $(seq 1 40); do
              if curl -sS "https://api.nuget.org/v3-flatcontainer/$package/index.json" \
                | jq -e --arg v "$PACKAGE_VERSION" '.versions | index($v) != null' >/dev/null 2>&1; then
                break
              fi
              test "$attempt" -lt 40 || { echo "::error::$package $PACKAGE_VERSION never appeared on nuget.org"; exit 1; }
              echo "$package $PACKAGE_VERSION is not on nuget.org yet; retrying in 30s ($attempt/40)"
              sleep 30
            done
          done

          echo "concord-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

  ci:
    if: github.event.inputs.announce-tag == ''
    needs: wait-for-core
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      packages: write
    secrets: inherit
    with:
      concord-version: ${{ needs.wait-for-core.outputs.concord-version }}

  release:
    name: semantic-release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
    outputs:
      published: ${{ steps.after.outputs.published }}
      version: ${{ steps.after.outputs.version }}
      tag: ${{ steps.after.outputs.tag }}
      previous-tag: ${{ steps.before.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/share/miniconda /usr/local/share/powershell
          sudo docker image prune -af
          df -h /

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - name: Stage RimWorld 1.1 refs
        id: refs-11
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.1'] }}
          dest: ${{ runner.temp }}/game-1.1

      - name: Stage RimWorld 1.2 refs
        id: refs-12
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.2'] }}
          dest: ${{ runner.temp }}/game-1.2

      - name: Stage RimWorld 1.3 refs
        id: refs-13
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.3'] }}
          dest: ${{ runner.temp }}/game-1.3

      - name: Stage RimWorld 1.4 refs
        id: refs-14
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.4'] }}
          dest: ${{ runner.temp }}/game-1.4

      - name: Stage RimWorld 1.5 refs
        id: refs-15
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.5'] }}
          dest: ${{ runner.temp }}/game-1.5

      - name: Stage RimWorld 1.6 refs
        id: refs-16
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.6'] }}
          dest: ${{ runner.temp }}/game-1.6

      - name: Stage RimWorld 1.7 refs
        id: refs-17
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.7'] }}
          dest: ${{ runner.temp }}/game-1.7

      - name: Record the tag before releasing
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPLIT_PUBLISH: '1'
          GAME_MANAGED_1_1: ${{ steps.refs-11.outputs.managed-dir }}
          GAME_MANAGED_1_2: ${{ steps.refs-12.outputs.managed-dir }}
          GAME_MANAGED_1_3: ${{ steps.refs-13.outputs.managed-dir }}
          GAME_MANAGED_1_4: ${{ steps.refs-14.outputs.managed-dir }}
          GAME_MANAGED_1_5: ${{ steps.refs-15.outputs.managed-dir }}
          GAME_MANAGED_1_6: ${{ steps.refs-16.outputs.managed-dir }}
          GAME_MANAGED_1_7: ${{ steps.refs-17.outputs.managed-dir }}
        run: ./node_modules/.bin/semantic-release

      - name: Read the tag it just cut
        id: after
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "$tag" = "${{ steps.before.outputs.tag }}" ] || [ -z "$tag" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "published=true"
              echo "tag=$tag"
              echo "version=${tag#v}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the release zips
        if: steps.after.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-zips
          path: dist/Concord-*.zip
          if-no-files-found: error

  publish:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: RimWorks/mod-ci/.github/workflows/publish.yml@v4
    permissions:
      contents: read
    secrets:
      STEAM_USERNAME: ${{ vars.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      version: ${{ needs.release.outputs.version }}
      zip-artifact: release-zips
      discord-mod-name: Concord
      discord-workshop-id: '3758333473'
      discord-embed-color: 9B59B6
      tag: ${{ needs.release.outputs.tag }}
      previous-tag: ${{ needs.release.outputs.previous-tag }}
